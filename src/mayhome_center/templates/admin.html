<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · MAYHOME</title><link rel="stylesheet" href="/static/app.css"><body class="login"><main class="login-card"><h1>Quản trị truy cập</h1><p><a href="/">← Tổng quan</a></p><p>Tài khoản chủ máy · Quản lý passkey. Khóa truy cập vẫn dùng để dự phòng.</p><div id="passkeys" data-csrf="{{ session.csrf }}"></div>{% if enabled %}<label for="admin-token">Xác thực lại bằng khóa truy cập</label><input id="admin-token" type="password" autocomplete="current-password" maxlength="256"><label for="passkey-label">Tên thiết bị</label><input id="passkey-label" maxlength="80" value="Thiết bị của tôi"><button id="register-passkey" type="button">Thêm passkey</button><ul>{% for item in credentials %}<li>{{ item.label }} <button type="button" data-revoke="{{ item.id }}">Thu hồi</button></li>{% else %}<li>Chưa có passkey.</li>{% endfor %}</ul>{% else %}<p>Passkey chưa được bật trên máy chủ.</p>{% endif %}<button id="logout" type="button">Đăng xuất</button><p id="passkey-message" role="status"></p><script src="/static/passkeys.js" defer></script></main></body></html>

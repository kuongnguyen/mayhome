[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "mayhome-center"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["Flask==3.1.2", "gunicorn==23.0.0"]
[project.optional-dependencies]
test = ["pytest==8.4.2"]
[tool.setuptools.package-data]
mayhome_center = ["templates/*.html", "static/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
